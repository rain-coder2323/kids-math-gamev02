<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xander's Big Counting Challenge</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e8f5e9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        #game-container {
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            text-align: center;
            width: 95%;
            max-width: 600px;
        }
        h1 { color: #2e7d32; margin-bottom: 10px; }
        #display-area {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            background: #f9f9f9;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 20px;
            min-height: 180px;
            justify-items: center;
        }
        .item-emoji { font-size: 2.5rem; }
        .options {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }
        button {
            font-size: 1.2rem;
            font-weight: bold;
            padding: 12px 5px;
            border: 2px solid #a5d6a7;
            border-radius: 10px;
            background-color: white;
            color: #2e7d32;
            cursor: pointer;
        }
        button:active { background-color: #a5d6a7; color: white; }
        #message {
            font-size: 1.2rem;
            margin-top: 15px;
            height: 25px;
            font-weight: bold;
        }
        #trophy-room { margin-top: 10px; font-size: 1.5rem; }
    </style>
</head>
<body>

<div id="game-container">
    <h1>Level 2: Count to 20! 🚀</h1>
    <div id="display-area"></div>
    <div class="options" id="options"></div>
    <div id="message"></div>
    <div id="trophy-room">Trophies: </div>
</div>

<script>
    const items = ["🚲", "🦖", "🚀", "⚽", "🦁", "🏎️"];
    let currentNumber = 0;
    let trophies = "";

    function startGame() {
        const displayArea = document.getElementById('display-area');
        const optionsArea = document.getElementById('options');
        const message = document.getElementById('message');
        
        message.innerText = "";
        displayArea.innerHTML = "";
        optionsArea.innerHTML = "";

        // Pick a random number between 1 and 20
        currentNumber = Math.floor(Math.random() * 20) + 1;
        const currentItem = items[Math.floor(Math.random() * items.length)];

        // Create the items in the grid
        for (let i = 0; i < currentNumber; i++) {
            const div = document.createElement('div');
            div.className = 'item-emoji';
            div.innerText = currentItem;
            displayArea.appendChild(div);
        }

        // Create buttons 1 to 20
        for (let i = 1; i <= 20; i++) {
            const btn = document.createElement('button');
            btn.innerText = i;
            btn.onclick = () => checkAnswer(i);
            optionsArea.appendChild(btn);
        }
    }

    function checkAnswer(choice) {
        const message = document.getElementById('message');
        const trophyArea = document.getElementById('trophy-room');
        
        if (choice === currentNumber) {
            message.style.color = "#45b649";
            message.innerText = "🌟 YOU GOT IT! 🌟";
            trophies += "🏆";
            trophyArea.innerText = "Trophies: " + trophies;
            setTimeout(startGame, 1500);
        } else {
            message.style.color = "#ff6b6b";
            message.innerText = "Try one more time! 😊";
        }
    }

    startGame();
</script>

</body>
</html>
